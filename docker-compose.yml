version: '3.8'

services:
  # PostgreSQL Database (recommended for production)
  postgres:
    image: postgres:15-alpine
    container_name: hubsec-postgres
    environment:
      POSTGRES_DB: hubsec
      POSTGRES_USER: hubsec_user
      POSTGRES_PASSWORD: hubsec_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hubsec-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubsec_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hubsec-api
    environment:
      DATABASE_URL: postgresql://hubsec_user:hubsec_password_change_me@postgres:5432/hubsec
      # For SQLite (development): sqlite:///./hubsec.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hubsec-network
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hubsec-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hubsec.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hubsec-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: hubsec-redis
    ports:
      - "6379:6379"
    networks:
      - hubsec-network
    profiles:
      - tools

networks:
  hubsec-network:
    driver: bridge

volumes:
  postgres_data:
